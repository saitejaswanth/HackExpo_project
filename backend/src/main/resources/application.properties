server.port=8080
# H2 file database (data survives restarts). Swap these 4 lines for MySQL if you prefer:
# spring.datasource.url=jdbc:mysql://localhost:3306/campushub
# spring.datasource.username=root
# spring.datasource.password=yourpassword
spring.datasource.url=jdbc:h2:file:./data/campushub;AUTO_SERVER=TRUE
spring.datasource.username=sa
spring.datasource.password=
spring.sql.init.mode=always
spring.h2.console.enabled=true
